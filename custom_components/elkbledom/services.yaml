set_random_color:
  name: Set Random Color
  description: Set a random RGB color to the LED strip
  fields:
    entity_id:
      name: Entity
      description: The light entity to control
      required: true
      example: "light.led1"
      selector:
        entity:
          domain: light
    brightness:
      name: Brightness
      description: Brightness level (0-255)
      required: false
      default: 255
      example: 200
      selector:
        number:
          min: 0
          max: 255
          mode: slider

set_rgb_color:
  name: Set RGB Color
  description: Set a specific RGB color to the LED strip
  fields:
    entity_id:
      name: Entity
      description: The light entity to control
      required: true
      example: "light.led1"
      selector:
        entity:
          domain: light
    r:
      name: Red
      description: Red value (0-255)
      required: true
      example: 255
      selector:
        number:
          min: 0
          max: 255
          mode: slider
    g:
      name: Green
      description: Green value (0-255)
      required: true
      example: 128
      selector:
        number:
          min: 0
          max: 255
          mode: slider
    b:
      name: Blue
      description: Blue value (0-255)
      required: true
      example: 64
      selector:
        number:
          min: 0
          max: 255
          mode: slider
    brightness:
      name: Brightness
      description: Brightness level (0-255)
      required: false
      default: 255
      example: 200
      selector:
        number:
          min: 0
          max: 255
          mode: slider

send_raw:
  name: Send Raw Command
  description: >-
    Write raw command bytes to the LED controller, for features the integration
    does not support yet (for example scenes or custom patterns captured from the
    vendor app). Commands are sent as-is; an invalid command may leave the
    controller in an unexpected state.
  fields:
    entity_id:
      name: Entity
      description: The ElkBLEDOM light to send the commands to
      required: true
      example: "light.led1"
      selector:
        entity:
          integration: elkbledom
          domain: light
    commands:
      name: Commands
      description: List of commands as hex strings, one BLE write each
      required: true
      example: '["7e 07 31 04 07 ff ff 00 ef"]'
      selector:
        object:
    delay_ms:
      name: Delay between commands
      description: Pause between consecutive commands, in milliseconds
      required: false
      default: 80
      selector:
        number:
          min: 0
          max: 5000
          unit_of_measurement: ms
